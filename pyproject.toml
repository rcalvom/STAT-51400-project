[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-doe"
version = "0.1.0"
description = "Configurable design-of-experiments runner for LLM analyses over a CSV dataset."
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.2.2", "together==2.12.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
